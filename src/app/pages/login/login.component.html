<form class="box" [formGroup]="form" (ngSubmit)="handleLogin()" novalidate>
  <h1>{{ 'login.title' | translate }}</h1>

  <div class="grid-template">
    <!-- Username -->
    <div class="col-12 field-group">
      <label for="login-input-username">{{
        'login.usernameLabel' | translate
      }}</label>
      <input
        id="login-input-username"
        type="text"
        autocomplete="username"
        [placeholder]="'login.usernamePlaceholder' | translate"
        [class.is-invalid]="form | isInvalidControl: 'username'"
        [attr.aria-invalid]="form | isInvalidControl: 'username'"
        aria-describedby="login-error-username"
        formControlName="username"
      />
      @if (form | isInvalidControl: 'username') {
        <div id="login-error-username" class="invalid-feedback">
          {{ form.controls.username | errorMessage }}
        </div>
      }
    </div>

    <!-- Password -->
    <div class="col-12 field-group">
      <label for="login-input-password">{{
        'login.passwordLabel' | translate
      }}</label>
      <input
        id="login-input-password"
        type="password"
        autocomplete="current-password"
        [placeholder]="'login.passwordPlaceholder' | translate"
        [class.is-invalid]="form | isInvalidControl: 'password'"
        [attr.aria-invalid]="form | isInvalidControl: 'password'"
        aria-describedby="login-error-password"
        formControlName="password"
      />
      @if (form | isInvalidControl: 'password') {
        <div id="login-error-password" class="invalid-feedback">
          {{ form.controls.password | errorMessage }}
        </div>
      }
    </div>
  </div>

  <div class="buttons-group">
    <button id="login-btn-submit" type="submit">
      {{ 'login.submitButton' | translate }}
    </button>
  </div>
</form>
